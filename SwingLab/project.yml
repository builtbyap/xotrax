name: SwingLab
options:
  bundleIdPrefix: com.swinglab
  deploymentTarget:
    iOS: "17.0"
targets:
  SwingLab:
    type: application
    platform: iOS
    sources:
      - path: SwingLab
        excludes:
          - Info.plist
    info:
      path: SwingLab/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
